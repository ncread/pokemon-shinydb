<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password — ShinyDex</title>
    <link rel="stylesheet" href="../css/style.css">

    <link rel="icon" type="image/png" href="../assets/favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="../assets/favicon/favicon.svg" />
    <link rel="shortcut icon" href="../assets/favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="../assets/favicon/apple-touch-icon.png" />
    <link rel="manifest" href="../assets/favicon/site.webmanifest" />
</head>
<body>
    <header class="header_container">
        <!-- <div class="header_overlay"></div> -->
            <div class="logo">
                <a href="https://noahcread.com" target="_blank"><img src="/assets/nrlogo2.png" alt="home"></a>
            </div>
        </div>
    </header>
    <div style="display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1rem;">
        <div style="width:100%; max-width:400px;">
            <div class="auth-brand" style="text-align:center; margin-bottom:1.5rem;">
                <h1 style="font-family:'Cinzel',serif; font-size:1.8rem; color:var(--gold);">✨ ShinyDex</h1>
                <p style="color:var(--text-secondary); font-size:0.87rem;">Reset your password</p>
            </div>
            <div class="auth-card">
                <div style="padding:1.6rem;">
                    <div id="reset-alert"></div>
                    <div class="form-group">
                        <label class="form-label">New Password</label>
                        <input type="password" class="form-input" id="new-password"
                               placeholder="Min. 6 characters">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Confirm Password</label>
                        <input type="password" class="form-input" id="confirm-password"
                               placeholder="Repeat your new password">
                    </div>
                    <button class="btn btn-primary" 
                            style="width:100%; padding:0.72rem;"
                            onclick="handleReset()">
                        Update Password
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase-client.js"></script>
    <script src="../js/auth.js"></script>
    <script>
        applyTheme();

        async function handleReset() {
            const newPass     = document.getElementById('new-password').value;
            const confirmPass = document.getElementById('confirm-password').value;

            if (!newPass || !confirmPass)
                return showResetAlert('Please fill in both fields.');
            if (newPass.length < 6)
                return showResetAlert('Password must be at least 6 characters.');
            if (newPass !== confirmPass)
                return showResetAlert('Passwords do not match.');

            try {
                const { error } = await db.auth.updateUser({ password: newPass });
                if (error) throw error;
                showResetAlert('Password updated! Redirecting…', 'success');
                setTimeout(() => window.location.href = '/pokemon-shinydb/', 2000);
            } catch (e) {
                showResetAlert(e.message);
            }
        }

        function showResetAlert(msg, type = 'error') {
            document.getElementById('reset-alert').innerHTML =
                `<div class="alert alert-${type}">${msg}</div>`;
        }
    </script>
</body>
</html>
